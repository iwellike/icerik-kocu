<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İçerik Koçu — SE Primer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <!-- EKRAN 1: Giriş (Stitch: giriş) -->
  <section id="screen-onboarding" class="screen" data-cy="screen-onboarding">
    <div class="topbar">İçerik Koçu</div>
    <div class="content">
      <h1>Seni tanıyalım</h1>

      <p class="q-label">Seviyen?</p>
      <div class="choice-list" data-cy="q-seviye">
        <button class="choice-btn" data-field="seviye" data-value="Yeni başlıyorum">Yeni başlıyorum</button>
        <button class="choice-btn" data-field="seviye" data-value="Deneyimliyim">Deneyimliyim</button>
      </div>

      <p class="q-label">Rolün?</p>
      <div class="choice-list" data-cy="q-rol">
        <button class="choice-btn" data-field="rol" data-value="Bireysel içerik üretici">Bireysel içerik üretici</button>
        <button class="choice-btn" data-field="rol" data-value="Marka/ajans yöneticisi">Marka/ajans yöneticisi</button>
      </div>

      <p class="q-label">Hedefin?</p>
      <div class="choice-list" data-cy="q-hedef">
        <button class="choice-btn" data-field="hedef" data-value="Erişim/takipçi büyütmek">Erişim/takipçi büyütmek</button>
        <button class="choice-btn" data-field="hedef" data-value="Güven ve itibar kazanmak">Güven ve itibar kazanmak</button>
      </div>

      <button id="start-btn" class="primary-btn" data-cy="start-btn" disabled>Başla</button>
    </div>
  </section>

  <!-- EKRAN 2: Sahne / Karar (Stitch: sahne) -->
  <section id="screen-karar" class="screen" data-cy="screen-karar">
    <div class="topbar">
      <span id="karar-step"></span>
      <span id="timer" class="timer hidden" data-cy="timer"></span>
    </div>
    <div class="content">
      <p id="intro-text" class="situation hidden" data-cy="intro-text"></p>
      <h1 id="karar-title"></h1>
      <p id="karar-context" class="situation"></p>

      <div id="hint-box" class="hint-box hidden" data-cy="hint-box"></div>

      <div id="karar-options" class="choice-list" data-cy="karar-options"></div>

      <div id="reflection-box" class="reflection-box hidden" data-cy="reflection-box">
        <label for="reflection-input">Bunu neden seçtin?</label>
        <textarea id="reflection-input" data-cy="reflection-input" rows="3" placeholder="Çünkü..."></textarea>
        <button id="submit-reflection" class="primary-btn" data-cy="submit-reflection" disabled>Gönder</button>
      </div>

      <div id="tutor-box" class="tutor-box hidden" data-cy="tutor-box">
        <p class="tutor-label">🎓 AI Tutor</p>
        <p id="tutor-text"></p>
        <button id="continue-btn" class="primary-btn" data-cy="continue-btn">Devam Et</button>
      </div>
    </div>
  </section>

  <!-- EKRAN 3: Son (Stitch: son) -->
  <section id="screen-son" class="screen" data-cy="screen-son">
    <div class="topbar">Sonuç</div>
    <div class="content">
      <h1 id="son-title" data-cy="son-title"></h1>
      <p id="son-text" class="situation" data-cy="son-text"></p>
      <p class="muted" id="son-score" data-cy="son-score"></p>
      <button id="restart-btn" class="primary-btn" data-cy="restart-btn">Baştan Başla</button>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
